name: Deploy Slidev to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium & system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Slidev with PDF download
        run: |
          pnpm exec slidev build documents/slides.md --base /${{ github.event.repository.name }}/ --download

      - name: Ensure PDF availability
        run: |
          if [ -f documents/dist/slidev-exported.pdf ]; then
            cp documents/dist/slidev-exported.pdf documents/dist/export.pdf
          elif [ -f documents/export.pdf ]; then
            cp documents/export.pdf documents/dist/export.pdf
            cp documents/export.pdf documents/dist/slidev-exported.pdf
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documents/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
